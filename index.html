<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDReader</title>

<!-- iOS Add to Home Screen / PWA -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MDReader">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<!-- Pinned versions: markdown-it 14, highlight.js 11, DOMPurify 3 -->
<link rel="stylesheet" href="lib/github.min.css">

<style>
  :root {
    --toolbar-h: 44px;
    --border: #e5e7eb;
    --bg: #ffffff;
    --fg: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --drop-bg: rgba(37, 99, 235, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #toolbar {
    height: var(--toolbar-h);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
  }
  #toolbar .title {
    margin-left: auto; color: var(--muted); font-weight: 600; letter-spacing: 0.5px;
  }
  button {
    font: inherit; padding: 6px 12px;
    background: #f9fafb; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #f3f4f6; }
  #main {
    display: flex;
    height: calc(100vh - var(--toolbar-h));
  }
  #editor, #preview {
    width: 50%; height: 100%;
    overflow: auto;
    padding: 16px 20px;
  }
  #editor {
    border: 0; outline: 0; resize: none;
    border-right: 1px solid var(--border);
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #fafafa;
  }
  #preview h1, #preview h2, #preview h3 { border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #preview pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow: auto; }
  #preview code:not(pre code) { background: #f6f8fa; padding: 1px 4px; border-radius: 3px; }
  #preview blockquote { border-left: 3px solid var(--border); color: var(--muted); margin: 8px 0; padding: 2px 12px; }
  #preview table { border-collapse: collapse; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 4px 8px; }
  #preview img { max-width: 100%; }
  body.reader-mode #editor { display: none; }
  body.reader-mode #preview { width: 100%; border-left: 0; }
  body.dragging::after {
    content: "Drop a .md file to open";
    position: fixed; inset: var(--toolbar-h) 0 0 0;
    background: var(--drop-bg);
    border: 2px dashed var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 18px; font-weight: 600;
    pointer-events: none;
    z-index: 10;
  }
  #toast {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
    background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;
    padding: 8px 14px; border-radius: 6px;
    display: none;
    z-index: 20;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-open">📂 Open</button>
    <button id="btn-save">💾 Save as</button>
    <button id="btn-toggle-editor" title="Toggle editor pane">📖 Reader</button>
    <input id="file-input" type="file" accept=".md,.markdown,.txt" hidden>
    <span class="title">MDReader</span>
  </div>
  <div id="main">
    <textarea id="editor" spellcheck="false" placeholder="Type or drop Markdown here…"></textarea>
    <div id="preview"></div>
  </div>
  <div id="toast"></div>

  <script src="lib/markdown-it.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <script>
  (function () {
    'use strict';

    const editor    = document.getElementById('editor');
    const preview   = document.getElementById('preview');
    const btnOpen   = document.getElementById('btn-open');
    const btnSave   = document.getElementById('btn-save');
    const btnToggle = document.getElementById('btn-toggle-editor');
    const fileInput = document.getElementById('file-input');
    const toast     = document.getElementById('toast');

    const STORAGE_KEY      = 'mdreader:content';
    const READER_MODE_KEY  = 'mdreader:reader-mode';

    const WELCOME = [
      '# Welcome to MDReader',
      '',
      'A tiny offline Markdown reader & editor. Type on the left, see rendered output on the right.',
      '',
      '## What you can do',
      '',
      '- **Open** a `.md` file with the toolbar button',
      '- **Drag** a `.md` file onto this page',
      '- **Save as** to download your current content',
      '- Content is auto-saved to your browser — come back anytime',
      '',
      '## Markdown features',
      '',
      '- Tables, task lists, strikethrough (~~like this~~)',
      '- Syntax-highlighted fenced code blocks',
      '',
      '```js',
      'function greet(name) {',
      '  return `hello, ${name}`;',
      '}',
      '```',
      '',
      '| Feature | Works |',
      '| ------- | ----- |',
      '| Tables  | ✓     |',
      '| Lists   | ✓     |',
      '',
      '- [x] read this',
      '- [ ] write something of your own',
      '',
    ].join('\n');

    // --- markdown-it instance ---
    // html:true passes raw HTML (e.g. <font color="red">...</font>) through to
    // DOMPurify instead of escaping it. DOMPurify still filters the allow-list below.
    const md = window.markdownit({
      html: true,
      linkify: true,
      typographer: true,
      breaks: false,
      highlight(code, lang) {
        try {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
          }
          return hljs.highlightAuto(code).value;
        } catch (_) {
          return '';
        }
      },
    });

    // GFM task-list support: rewrite `[ ]` / `[x]` at the start of list items.
    md.core.ruler.after('inline', 'task-lists', function (state) {
      for (const tok of state.tokens) {
        if (tok.type !== 'inline') continue;
        const children = tok.children || [];
        if (children.length && children[0].type === 'text') {
          const m = children[0].content.match(/^\[([ xX])\]\s+(.*)$/);
          if (m) {
            const checked = m[1].toLowerCase() === 'x';
            children[0].content = m[2];
            const box = new state.Token('html_inline', '', 0);
            box.content = `<input type="checkbox" disabled${checked ? ' checked' : ''}> `;
            children.unshift(box);
          }
        }
      }
    });

    // --- Render pipeline ---
    function render() {
      const html  = md.render(editor.value);
      // Allow the deprecated <font> tag (color/face/size) used by legacy .md docs.
      // Sanitization still runs; only these names are added to the default allow-list.
      const clean = DOMPurify.sanitize(html, {
        ADD_TAGS: ['font'],
        ADD_ATTR: ['target', 'color', 'face', 'size'],
      });
      preview.innerHTML = clean;
    }

    let renderT = 0;
    function scheduleRender() {
      clearTimeout(renderT);
      renderT = setTimeout(render, 150);
    }

    // --- Persistence ---
    function loadInitial() {
      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (_) {}
      editor.value = (saved !== null && saved !== '') ? saved : WELCOME;
    }

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, editor.value); } catch (_) {}
    }

    let persistT = 0;
    function schedulePersist() {
      clearTimeout(persistT);
      persistT = setTimeout(persist, 150);
    }

    editor.addEventListener('input', () => {
      scheduleRender();
      schedulePersist();
    });

    // --- File IO ---
    let toastT = 0;
    function showError(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(toastT);
      toastT = setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function loadFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        editor.value = String(reader.result || '');
        render();
        persist();
      };
      reader.onerror = () => showError('Could not read file: ' + file.name);
      reader.readAsText(file);
    }

    btnOpen.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      loadFile(fileInput.files && fileInput.files[0]);
      fileInput.value = '';
    });

    btnSave.addEventListener('click', () => {
      const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'document.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    // --- Drag & drop ---
    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => {
      if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
      dragDepth++;
      document.body.classList.add('dragging');
    });
    window.addEventListener('dragleave', () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) document.body.classList.remove('dragging');
    });
    window.addEventListener('dragover', (e) => {
      if (!e.dataTransfer) return;
      if (Array.from(e.dataTransfer.types).includes('Files')) {
        e.preventDefault();
      }
    });
    window.addEventListener('drop', (e) => {
      if (!e.dataTransfer) return;
      const files = e.dataTransfer.files;
      if (!files || !files.length) return;
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      loadFile(files[0]);
    });

    // --- Reader mode (editor hidden / visible) ---
    function applyReaderMode(on) {
      document.body.classList.toggle('reader-mode', on);
      btnToggle.textContent = on ? '✏️ Edit' : '📖 Reader';
    }

    function loadReaderMode() {
      let on = false;
      try { on = localStorage.getItem(READER_MODE_KEY) === '1'; } catch (_) {}
      applyReaderMode(on);
    }

    btnToggle.addEventListener('click', () => {
      const on = !document.body.classList.contains('reader-mode');
      applyReaderMode(on);
      try { localStorage.setItem(READER_MODE_KEY, on ? '1' : '0'); } catch (_) {}
    });

    // --- Init ---
    loadInitial();
    loadReaderMode();
    render();
  })();
  </script>
</body>
</html>
